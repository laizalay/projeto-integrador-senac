{% extends 'base.html' %}
{% block title %}Redefinir Senha{% endblock %}

{% block content %}
<div class="container-main">
  <div class="confirm-card">
    <span class="confirm-icon">🔑</span>
    <h2>Redefinir Senha</h2>
    <p>Defina uma nova senha para <strong>{{ usuario.get_full_name|default:usuario.username }}</strong>.</p>

    <form method="POST" style="text-align:left;margin-top:1.5rem;">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Nova Senha <span class="form-required">*</span></label>
        <input type="password" name="senha" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>
      <div class="form-group">
        <label class="form-label">Confirmar Senha <span class="form-required">*</span></label>
        <input type="password" name="senha_confirma" class="form-control" placeholder="Repita a senha" minlength="6" required>
      </div>
      {% if erro %}
        <p style="color:var(--danger);font-size:0.85rem;margin-bottom:1rem;">{{ erro }}</p>
      {% endif %}
      <div class="confirm-actions" style="margin-top:1.5rem;">
        <a href="{% url 'usuarios' %}" class="btn btn-outline">Cancelar</a>
        <button type="submit" class="btn btn-primary">Salvar Nova Senha</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
