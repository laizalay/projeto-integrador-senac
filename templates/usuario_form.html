{% extends "base.html" %}
{% block title %}Novo Usuário{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Cadastrar Usuário</h1>
    <p class="page-sub">Apenas administradores e coordenadores podem cadastrar usuários.</p>
  </div>
  <a href="{{ url_for('listar_usuarios') }}" class="btn btn-outline">← Voltar</a>
</div>

<div class="form-wrapper">
  <form method="POST" class="main-form">

    <div class="form-group">
      <label for="nome">Nome completo <span class="required">*</span></label>
      <input type="text" id="nome" name="nome" placeholder="João da Silva" required />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="email">E-mail <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="joao@senac.br" required />
      </div>

      <div class="form-group">
        <label for="papel">Papel <span class="required">*</span></label>
        <select id="papel" name="papel">
          <option value="aluno">Aluno</option>
          <option value="coordenador">Coordenador</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="senha">Senha provisória <span class="required">*</span></label>
      <input type="password" id="senha" name="senha"
             placeholder="Mínimo 6 caracteres" minlength="6" required />
    </div>

    <div class="form-actions">
      <a href="{{ url_for('listar_usuarios') }}" class="btn btn-outline">Cancelar</a>
      <button type="submit" class="btn btn-primary">Cadastrar Usuário</button>
    </div>
  </form>
</div>
{% endblock %}
